name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # tests/mesure-driver.test.ts lance le driver du skill run-terramemo
      # (python3, stdlib seule) : même version que sur le PC.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # Émulateur Firestore des tests des règles (tests/regles.test.ts).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:regles
      # Comptes e-mail sur l'émulateur Auth (tests/comptes.test.ts, J1b lot 1).
      - run: npm run test:comptes
      - run: npm run build
