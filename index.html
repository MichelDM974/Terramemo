<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080809" />
  <title>Terramemo</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preload" href="/vendor/inter/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Données de la carte : téléchargées pendant le chargement du script (lues par fetch dans src/map/donnees.ts). -->
  <link rel="preload" href="/geo/monde.topo.json" as="fetch" crossorigin />
  <link rel="preload" href="/geo/pays.json" as="fetch" crossorigin />
  <link rel="preload" href="/geo/contestees.json" as="fetch" crossorigin />
  <link rel="preload" href="/geo/noms.fr.json" as="fetch" crossorigin />
</head>
<body>
  <header>
    <div class="header-title">
      <h1><a href="/"><img class="logo" src="/favicon.svg" width="40" height="40" alt="">Terramemo</a></h1>
      <p class="tagline">La géographie du monde, au doigt.</p>
    </div>
    <nav class="page-nav" aria-label="Pages">
      <a href="#carte" class="nav-link active" aria-current="page">Carte</a>
      <a href="#toucher" class="nav-link">Toucher</a>
      <a href="#saisie" class="nav-link">Saisie</a>
      <a href="#chrono" class="nav-link">Chrono</a>
    </nav>
    <div class="header-actions">
      <div class="settings-menu">
        <button type="button" id="settings-btn" title="Paramètres" aria-label="Paramètres" aria-expanded="false">⚙</button>
        <div id="settings-popup" class="settings-popup" hidden>
          <h3>Paramètres</h3>
          <div class="reglage">
            <span class="reglage-nom">Rendu</span>
            <div class="seg" id="reglage-rendu" role="group" aria-label="Rendu">
              <button type="button" data-v="g">g</button>
              <button type="button" data-v="css">css</button>
              <button type="button" data-v="canvas">canvas</button>
              <button type="button" data-v="webgl">webgl</button>
            </div>
          </div>
          <div class="reglage">
            <span class="reglage-nom">Projection</span>
            <div class="seg" id="reglage-projection" role="group" aria-label="Projection">
              <button type="button" data-v="monde">Monde</button>
              <button type="button" data-v="pacifique">Pacifique</button>
            </div>
          </div>
          <label class="case"><input type="checkbox" id="reglage-mesures"> Afficher les mesures</label>
          <!-- Crédits des données : rempli par src/main.ts (textes.credits.reglages). -->
          <p class="hint" id="credits"></p>
        </div>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
