<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080809" />
  <title>Terramemo</title>
  <!-- L'icône passe par Vite (src/icone.svg → /assets/icone-<empreinte>.svg) : une
       nouvelle icône a une nouvelle adresse, que les navigateurs ne servent pas de leur cache. -->
  <link rel="icon" type="image/svg+xml" href="/src/icone.svg" />
  <link rel="preload" href="/vendor/inter/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Données de la carte : téléchargées pendant le chargement du script (lues par fetch dans src/map/donnees.ts). -->
  <link rel="preload" href="/geo/monde.topo.json" as="fetch" crossorigin />
  <link rel="preload" href="/geo/pays.json" as="fetch" crossorigin />
  <link rel="preload" href="/geo/contestees.json" as="fetch" crossorigin />
  <link rel="preload" href="/geo/noms.fr.json" as="fetch" crossorigin />
</head>
<body>
  <header>
    <div class="header-title">
      <h1><a href="#carte" title="La carte"><img class="logo" src="/src/icone.svg" width="40" height="40" alt=""><span class="titre-nom">Terramemo</span></a></h1>
      <p class="tagline">La géographie du monde, au doigt.</p>
    </div>
    <!-- Recherche : branchée par src/vues/recherche.ts (liste des lieux, texte d'aide selon la largeur). -->
    <div class="recherche" role="search">
      <svg class="recherche-icone" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg>
      <input type="search" id="recherche-champ" aria-label="Chercher un lieu" placeholder="Chercher un pays, une commune…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" data-gramm="false">
    </div>
    <div class="header-actions">
      <a href="#jouer" class="bouton-jouer" id="jouer-btn" data-vue="jouer"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>Jouer</a>
      <a href="#classement" class="icone-btn" id="classement-btn" data-vue="classement" title="Classements" aria-label="Classements"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 16.5V21M7 3.5h10V9a5 5 0 0 1-10 0z"/><path d="M17 5.5h3V7a3.5 3.5 0 0 1-3.5 3.5M7 5.5H4V7a3.5 3.5 0 0 0 3.5 3.5"/></svg></a>
      <div class="settings-menu">
        <button type="button" id="settings-btn" title="Paramètres" aria-label="Paramètres" aria-expanded="false">⚙</button>
        <div id="settings-popup" class="settings-popup" hidden>
          <h3>Paramètres</h3>
          <div class="reglage">
            <span class="reglage-nom">Rendu</span>
            <div class="seg" id="reglage-rendu" role="group" aria-label="Rendu">
              <button type="button" data-v="g">g</button>
              <button type="button" data-v="css">css</button>
              <button type="button" data-v="canvas">canvas</button>
              <button type="button" data-v="webgl">webgl</button>
            </div>
          </div>
          <div class="reglage">
            <span class="reglage-nom">Projection</span>
            <div class="seg" id="reglage-projection" role="group" aria-label="Projection">
              <button type="button" data-v="monde">Monde</button>
              <button type="button" data-v="pacifique">Pacifique</button>
            </div>
          </div>
          <label class="case"><input type="checkbox" id="reglage-mesures"> Afficher les mesures</label>
          <p class="reglage-outil"><a href="#saisie" id="lien-saisie">Essai des claviers</a> <span class="hint">(Saisie, J0)</span></p>
          <!-- Essai J0 (Trouver ou Reconnaître sur la série des plus difficiles, celle du
               pilote de mesure), hors des listes de Jouer : rempli par src/main.ts (remplirEssaiJ0). -->
          <p class="reglage-outil" id="reglage-essai"></p>
          <!-- Crédits des données : rempli par src/main.ts (textes.credits.reglages). -->
          <p class="hint" id="credits"></p>
        </div>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
