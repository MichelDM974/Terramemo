name: Android

# APK de débogage du site emballé par Capacitor. Seulement à la demande ou sur un tag
# « v* », jamais à chaque push : toute modification du site change l'APK, et ce job
# coûterait des minutes Actions à chaque commit (plan, « Technique »). La signature de
# release et la release « android » viendront au J1a.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Capacitor 8 : AGP 8.13 et Gradle 8.14 demandent le JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Cache libre (MIT) : celui par défaut de la v6 est propriétaire,
          # gratuit pour un dépôt privé seulement le temps d'un essai (comme Light).
          cache-provider: basic

      - run: npm ci
      - run: npm test
      - name: Construire le site et le copier dans android/
        run: npm run build && npx cap sync android

      - name: Compiler l'APK de débogage
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: cartographe-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
