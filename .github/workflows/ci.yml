name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    # Dépôt public : jamais de runner auto-hébergé (une PR de fork y exécuterait son code).
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # tests/mesure-driver.test.ts lance le driver du skill run-terramemo
      # (python3, stdlib seule) : même version que sur le PC.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # Émulateur Firestore des tests des règles (tests/regles.test.ts).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:regles
      # Comptes e-mail sur l'émulateur Auth (tests/comptes.test.ts, J1b lot 1).
      - run: npm run test:comptes
      # Critère de #3 : deux appareils, l'un hors ligne, au même état (tests/synchro-emulateurs.test.ts, J1b lot 4).
      - run: npm run test:synchro
      # Outil du propriétaire sur les émulateurs (tests/admin.test.ts, J1b lot 5b) : à blanc, plan exact, pseudos voisins, idempotence.
      - run: npm run test:admin
      - run: npm run build
